  ravulizumab:    {admin_hours: 2.0, chair_hours: 2.5, source: "Ultomiris PI s.2: maintenance infusion ~1.3-2.0 h by weight"}
  inebilizumab:   {admin_hours: 1.5, chair_hours: 2.5, source: "Uplizna PI s.2: IV over 90 minutes; observe 1 h"}
  immune_globulin: {admin_hours: 3.0, chair_hours: 3.5, source: "IVIG PIs: rate-escalated infusions typically 2-4 h"}
  denosumab:      {admin_hours: 0.0, chair_hours: 0.5, source: "Prolia PI: single subcutaneous injection"}
  romosozumab:    {admin_hours: 0.0, chair_hours: 0.5, source: "Evenity PI: two subcutaneous injections"}
  certolizumab:   {admin_hours: 0.0, chair_hours: 0.5, source: "Cimzia PI: subcutaneous injection"}
  onabotulinumtoxinA: {admin_hours: 0.0, chair_hours: 0.0, source: "Chemodenervation procedure (physician time, not chair)"}
