  risankizumab:   {admin_hours: 1.0, chair_hours: 1.5, source: "Skyrizi PI s.2: IV induction over at least 1 hour"}
  mirikizumab:    {admin_hours: 0.5, chair_hours: 1.0, source: "Omvoh PI s.2: IV over at least 30 minutes"}
