  rituximab:      {admin_hours: 4.0, chair_hours: 4.5, source: "Rituxan PI s.2.1: subsequent infusions escalated to 400 mg/h; ~3-4 h for 1,000 mg"}
  tocilizumab:    {admin_hours: 1.0, chair_hours: 1.5, source: "Actemra PI s.2: IV infusion over 60 minutes"}
  natalizumab:    {admin_hours: 1.0, chair_hours: 2.0, source: "Tysabri PI s.2: infuse over ~1 hour; observe 1 hour after (first 12 infusions)"}
  ustekinumab:    {admin_hours: 1.0, chair_hours: 1.5, source: "Stelara PI s.2: IV induction over at least 1 hour"}
  eculizumab:     {admin_hours: 1.0, chair_hours: 1.5, source: "Soliris PI s.2: adults over 35 minutes; 1 h monitoring"}
  abatacept:      {admin_hours: 0.5, chair_hours: 1.0, source: "Orencia PI s.2: IV over 30 minutes"}
  golimumab:      {admin_hours: 0.5, chair_hours: 1.0, source: "Simponi Aria PI s.2: IV over 30 minutes"}
  belimumab:      {admin_hours: 1.0, chair_hours: 1.5, source: "Benlysta PI s.2: IV over 1 hour"}
  pegloticase:    {admin_hours: 2.0, chair_hours: 3.0, source: "Krystexxa PI s.2: no less than 120 minutes; observe ~1 hour"}
